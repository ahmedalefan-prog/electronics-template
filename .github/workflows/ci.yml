name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    if: ${{ hashFiles('firmware/platformio.ini') != '' }}
    runs-on: ubuntu-latest
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build device firmware
        working-directory: firmware
        run: pio run -e device
      - name: Unit tests (native)
        working-directory: firmware
        run: pio test -e native
      - name: Build simulation image
        working-directory: firmware
        run: pio run -e sim
      - name: Wokwi simulation
        if: ${{ hashFiles('sim/wokwi.toml') != '' && env.WOKWI_CLI_TOKEN != '' }}
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: sim
          timeout: 30000
          scenario: scenarios/smoke.yaml
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/.pio/build/device/firmware.bin

  app:
    if: ${{ hashFiles('app/package.json') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
